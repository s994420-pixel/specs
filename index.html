<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自開盤口 — 規格書</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Noto Sans TC', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 640px;
      text-align: center;
    }
    .label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #64b5f6;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.4rem;
    }
    .desc {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 1.6rem;
      line-height: 1.6;
    }
    .flow-img {
      width: 100%;
      border-radius: 10px;
      background: #1a202c;
      margin-bottom: 2rem;
      display: block;
    }
    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #a0aec0;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .btn {
      display: block;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .btn-primary { background: #1a56db; color: #fff; }
    .btn-primary:hover { background: #1e429f; }
    .btn-secondary { background: #f0f4ff; color: #1a56db; border: 1px solid #c3dafe; }
    .btn-secondary:hover { background: #e0eaff; }
    .btn span {
      display: block;
      font-size: 0.78rem;
      font-weight: 400;
      opacity: 0.75;
      margin-top: 0.2rem;
    }
    .footer { margin-top: 2rem; font-size: 0.75rem; color: #a0aec0; }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">WOW Gaming · 功能規格書</p>
    <h1>自開盤口</h1>
    <p class="desc">請選擇要查看的規格書版本</p>

    <img class="flow-img"
      src="https://raw.githubusercontent.com/s994420-pixel/specs/main/%E8%87%AA%E9%96%8B%E8%B3%AD%E7%9B%A4/%E8%87%AA%E8%A8%82%E7%9B%A4%E5%8F%A3%E6%B5%81%E7%A8%8B%E5%9C%96_%E7%99%BD%E5%AD%97.png"
      alt="自訂盤口功能流程圖" />

    <p class="section-label">規格書</p>
    <div class="btn-group">
      <a class="btn btn-primary" href="./%E8%87%AA%E9%96%8B%E8%B3%AD%E7%9B%A4/%E4%BB%A3%E7%90%86%E5%BE%8C%E5%8F%B0_%E8%87%AA%E8%A8%82%E8%B3%AD%E7%9B%A4_v2.html">
        代理後台
        <span>後台管理端規格書 v2</span>
      </a>
      <a class="btn btn-secondary" href="./%E8%87%AA%E9%96%8B%E8%B3%AD%E7%9B%A4/%E6%9C%83%E5%93%A1%E7%AB%AF_%E8%87%AA%E8%A8%82%E8%B3%AD%E7%9B%A4_v1.html">
        會員端
        <span>前台會員端規格書 v1</span>
      </a>
    </div>
    <p class="footer">Kate Lai · PM / 產品企劃</p>
  </div>
</body>
</html>
